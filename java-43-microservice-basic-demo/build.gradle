plugins {
    /*
     * ROOT build.gradle
     *
     * Buradaki plugin sürümleri root proje tarafından yönetilir.
     * Alt modüllerde ayrıca version yazmaya gerek kalmaz.
     */
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'application'
    id 'java-library'
}


/*
 * ROOT + bütün subproject'ler için ortak ayarlar
 */
allprojects {

    /*
     * Ortak dependency/version tanımlarını yükler.
     */
    apply from: "${rootDir}/dependencies.gradle"

    group = 'com.example'
    version = '1.0.1'

    /*
     * Java 21
     */
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }
}


/*
 * Sadece alt projeler / servisler için geçerli ayarlar
 */
subprojects {

    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'application'

    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'


    /*
     * Java source encoding
     */
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }


    /*
     * Bütün servislerde ortak kullanılacak bağımlılıklar
     */
    dependencies {

        implementation libs.springBootWeb
        implementation libs.springBootActuator
        implementation libs.springBootDataJpa

        /*
         * Lombok
         */
        compileOnly libs.lombok
        annotationProcessor libs.lombok

        testCompileOnly libs.lombok
        testAnnotationProcessor libs.lombok

        /*
         * Database
         */
        runtimeOnly libs.postgresql

        /*
         * MySQL kullanacak servis varsa açılabilir.
         */
        runtimeOnly libs.mysql

        /*
         * Development
         */
        developmentOnly libs.springBootDevtools


        /*
         * Testing
         */
        testImplementation libs.springBootStarterTest

        testRuntimeOnly libs.junitPlatformLauncher
    }


    tasks.named('test') {
        useJUnitPlatform()
    }
}


/*
 * Lombok annotation processor'ın compileOnly tarafından
 * kullanılabilmesini sağlar.
 */
configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}